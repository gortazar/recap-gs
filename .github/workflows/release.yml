# Publish a release for a tag.
#
#     git tag v0.1 && git push origin v0.1
#
# Everything this needs is in this repository, which is why the workflow lives here: the
# automatic GITHUB_TOKEN can create a release and upload assets in its own repo, and no
# personal access token or secret is involved.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # A release that fails its own tests is worse than no release.
      - run: nix flake check --print-build-logs

      # The tag says which version this is; metadata.json and the tag must agree, or people
      # end up installing something other than what the release notes describe.
      #
      # Until 0.5 this step read metadata.json nowhere — it checked the tag was non-empty
      # and passed, which is why it could not have caught the manifest having no version at
      # all. It compares them now, and fails the run rather than publishing a release whose
      # asset contradicts its own tag.
      - name: Check the tag against metadata.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r '."version-name" // empty' src/metadata.json)"
          echo "tag says '$tag', src/metadata.json says '$manifest'"
          if [ -z "$tag" ]; then
            echo "::error::the tag is empty after stripping its leading v" >&2
            exit 1
          fi
          if [ -z "$manifest" ]; then
            echo "::error::src/metadata.json has no version-name to check the tag against" >&2
            exit 1
          fi
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match version-name $manifest — refusing to publish" >&2
            exit 1
          fi
          echo "tag and manifest agree on $tag"

      - name: Pack the extension
        run: |
          nix build --print-build-logs
          mkdir -p dist
          cp result/*.shell-extension.zip dist/
          cd dist
          for zip in *.zip; do
            sha256sum "$zip" > "$zip.sha256"
          done
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          Install without building anything:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/gortazar/recap-gs/main/install.sh | sh
          ```

          Then log out and back in, and enable it in the Extensions app.

          The asset below is the packed extension, exactly as `gnome-extensions pack` would
          lay it out, with its SHA-256 beside it. It needs
          [recap](https://github.com/gortazar/recap) on your PATH to have anything to show;
          without it the menu says so and does nothing else.
          NOTES
          )"
